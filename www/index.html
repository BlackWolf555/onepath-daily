<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e1a" />
<title>OnePath — Daily Path Puzzle</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <div id="game-title">OnePath</div>
      <div id="puzzle-label">Daily</div>
    </div>
    <div class="hud-right">
      <div id="streak" title="Day streak">🔥 <span id="streak-num">0</span></div>
      <div id="timer">0:00</div>
    </div>
  </header>

  <div id="board-wrap">
    <canvas id="board"></canvas>
    <div id="hint-bar"></div>
  </div>

  <footer id="controls">
    <button id="btn-mode" class="btn secondary">Practice</button>
    <button id="btn-reset" class="btn secondary">Reset</button>
    <button id="btn-new" class="btn secondary hidden">New</button>
  </footer>

  <div id="progress-wrap"><div id="progress-fill"></div></div>

  <!-- Start overlay -->
  <div id="start-screen" class="overlay">
    <div class="card">
      <h1>OnePath</h1>
      <p class="tagline">Draw <b>one</b> continuous path.<br/>Visit the numbers <b>in order</b>.<br/>Fill <b>every</b> tile.</p>
      <button id="btn-daily" class="btn primary big">▶ Daily Puzzle</button>
      <button id="btn-practice" class="btn secondary big">Practice Mode</button>
      <div id="start-streak">🔥 Streak: <span id="start-streak-num">0</span> day(s)</div>
    </div>
  </div>

  <!-- Win overlay -->
  <div id="win-screen" class="overlay hidden">
    <div class="card">
      <h1>🎉 Solved!</h1>
      <div id="win-stats"></div>
      <div id="win-emoji" class="emoji-grid"></div>
      <button id="btn-share" class="btn primary big">Share Result</button>
      <button id="btn-again" class="btn secondary big">Play Again</button>
      <div id="share-note"></div>
    </div>
  </div>
</div>
<script src="js/puzzle.js"></script>
<script src="js/game.js"></script>
</body>
</html>
